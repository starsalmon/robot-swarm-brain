# Robot fleet — dockerhost runs this stack; bots connect over WiFi micro-ROS.
#   docker compose up -d
# Starts: agent + explore/chase brain + ROS CLI shell (no per-command containers).

name: robot-fleet


services:
  microros-agent:
    image: microros/micro-ros-agent:jazzy
    container_name: microros-agent
    network_mode: host
    command: ["udp4", "--port", "8888"]
    restart: unless-stopped

  fleet-brain:
    image: ros:jazzy-ros-base
    container_name: fleet-brain
    network_mode: host
    depends_on:
      - microros-agent
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - BOT_NS=${BOT_NS:-bot1}
      - WANDER_CRUISE=${WANDER_CRUISE:-0.20}
      - WANDER_CRUISE_MIN=${WANDER_CRUISE_MIN:-0.14}
      - WANDER_CRUISE_MAX=${WANDER_CRUISE_MAX:-0.24}
      - MAX_FWD=0.18
      - WHEEL_MIN=0.06
      - WANDER_CARPET=${WANDER_CARPET:-1}
      - WANDER_BURST_ENABLE=${WANDER_BURST_ENABLE:-0}
      - WANDER_STOP_M=${WANDER_STOP_M:-0.14}
      - WANDER_SLOW_M=${WANDER_SLOW_M:-0.26}
      - WANDER_CLOSE_M=${WANDER_CLOSE_M:-0.22}
      - WANDER_AVOID_BACKUP_S=${WANDER_AVOID_BACKUP_S:-0.60}
      - WANDER_AVOID_COOLDOWN_S=${WANDER_AVOID_COOLDOWN_S:-1.8}
      - WANDER_COMMIT_CRUISE_S=${WANDER_COMMIT_CRUISE_S:-1.6}
      - CHASE_CRUISE=${CHASE_CRUISE:-0.24}
      - WANDER_BURST_SPEED=${WANDER_BURST_SPEED:-0.70}
      - WANDER_BURST_SEC=${WANDER_BURST_SEC:-1.5}
      - WANDER_BURST_MIN_INTERVAL=${WANDER_BURST_MIN_INTERVAL:-50}
      - WANDER_BURST_MAX_INTERVAL=${WANDER_BURST_MAX_INTERVAL:-120}
      - DRIVE_CSV=/tmp/fleet-drive-log.csv
      - MEET_PEER_STABLE=3
      - IMU_CAL_SEC=${IMU_CAL_SEC:-2.5}
      - IMU_CAL_MIN_SAMPLES=${IMU_CAL_MIN_SAMPLES:-50}
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/explore_then_chase.py"
    restart: unless-stopped

  # Beeper (bot3) — explore + person follow (camera via detector). NOT auto-started: profile "beeper".
  # Obstacle checks always apply (brain apply_sonar_stop + forward gate on /bot3/sonar/range, and firmware ToF gate).
  beeper-brain:
    image: ros:jazzy-ros-base
    container_name: beeper-brain
    network_mode: host
    profiles: ["beeper"]
    depends_on:
      - microros-agent
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - BOT_NS=bot3
      - FLEET_IR_ID=3
      - IMU_TOPIC=imu/data
      - REQUIRE_IMU=1
      - WANDER_GYRO_SIGN=${BEEPER_GYRO_SIGN:-1}
      - WANDER_CRUISE=0.16
      - WANDER_CRUISE_MIN=0.12
      - WANDER_CRUISE_MAX=0.18
      - MAX_FWD=0.18
      - WHEEL_MIN=0.06
      - WANDER_BURST_ENABLE=0
      - WANDER_STOP_M=0.18
      - WANDER_SLOW_M=0.35
      - WANDER_CLOSE_M=0.25
      - PERSON_FOLLOW=1
      - FOLLOW_CAM=beeper
      - DET_URL=http://127.0.0.1:8765
      - FOLLOW_STOP_HFRAC=${BEEPER_FOLLOW_STOP_HFRAC:-0.60}
      - FOLLOW_CRUISE=0.16
      - FOLLOW_LOST_S=3.0
      - DRIVE_CSV=/tmp/beeper-drive-log.csv
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/explore_then_chase.py"
    restart: unless-stopped

  # Tracked bot (bot2) — wander on connect (no Go button). Slow until ToF is live.
  tracked-brain:
    image: ros:jazzy-ros-base
    container_name: tracked-brain
    network_mode: host
    depends_on:
      - microros-agent
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - BOT_NS=bot2
      - DRIVE_ENABLE=${TRACKED_DRIVE_ENABLE:-1}  # follows /fleet/allow_drive like Rover
      - DRIVE_CSV=/tmp/tracked-drive-log.csv
      - MEET_PEER_STABLE=3
      - WANDER_STOP_M=0.12
      - WANDER_TRAP_COOLDOWN_S=1.2
      - REQUIRE_IMU=0
      - WANDER_CRUISE=${TRACKED_CRUISE:-0.14}
      - WANDER_CRUISE_MIN=${TRACKED_CRUISE_MIN:-0.10}
      - WANDER_CRUISE_MAX=${TRACKED_CRUISE_MAX:-0.18}
      - WANDER_BURST_ENABLE=0
      - IMU_CAL_SEC=${IMU_CAL_SEC:-2.5}
      - IMU_CAL_MIN_SAMPLES=${IMU_CAL_MIN_SAMPLES:-50}
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/explore_then_chase.py"
    restart: unless-stopped

  # LEGO rover brain — always on, Go-button gated (standby until tap Go on bot).
  rover-brain:
    image: ros:jazzy-ros-base
    container_name: rover-brain
    network_mode: host
    depends_on:
      - microros-agent
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - ROVER_SONAR=1
      - ROVER_CRUISE_RADAR=0
      # Slightly slower default gives the brain time to steer away before ESP braking.
      # Speed cap 25% usable (cmd 0.25 = 25% of the usable range above the firmware PWM floor).
      # Burst capped to match; gentle 10% reverse; steer-around starts curving at 1.10 m.
      - ROVER_AUTO_MAX_LINEAR=${ROVER_AUTO_MAX_LINEAR:-0.12}
      - ROVER_AUTO_REVERSE_POWER=0.10
      - ROVER_AUTO_BURST_MAX=0.12
      - ROVER_PICTURE_STEER_FAR_M=1.10
      - ROVER_PICTURE_STEER_SLOW=0.80
      # 0.10 was too low to steer away early; keep smoothness on ESP ramp,
      # but allow the brain enough authority to curve away before brake range.
      - ROVER_AUTO_MAX_ANGULAR=${ROVER_AUTO_MAX_ANGULAR:-0.18}
      - ROVER_AUTO_REVERSE_FRAC=${ROVER_AUTO_REVERSE_FRAC:-0.60}
      - ROVER_IMU_GYRO_SIGN=${ROVER_IMU_GYRO_SIGN:-1.0}
      - ROVER_MODE=${ROVER_MODE:-explore}
      # rover-behaviour owns /cmd_vel + /rover/session; explore output is only a suggestion.
      - ROVER_EXPLORE_ARBITER=1
      - ROVER_CMD_TOPIC=/rover/explore/cmd_vel
      - ROVER_SESSION_TOPIC=/rover/explore/session
      # No Pro S3 / L8 picture — blind cruise + bump/stall (set 1 to restore ToF steer)
      - ROVER_PICTURE=1
      - ROVER_WHEEL_STRIPS=60
      - ROVER_WHEEL_DIAM_MM=95
      - ROVER_WHEEL_TRACK_MM=130
      - ROVER_NAV2=${ROVER_NAV2:-0}
      - ROVER_WHEEL_STALL=${ROVER_WHEEL_STALL:-1}
      - ROVER_WHEEL_STALL_GRACE_MS=900
      - ROVER_WHEEL_STALL_COOLDOWN_MS=5000
      - MEET_PEER_STABLE=3
      - ROVER_WHEEL_CAL_FILE=/opt/fleet/cal/wheel_stall.env
      - HALLWAY_TARGET_M=${HALLWAY_TARGET_M:-0.28}
      - HALLWAY_CRUISE=${HALLWAY_CRUISE:-0.15}
      - HALLWAY_KP=${HALLWAY_KP:-3.2}
      - HALLWAY_WALL=${HALLWAY_WALL:-auto}
      - HALLWAY_MAX_VALID_M=${HALLWAY_MAX_VALID_M:-2.0}
      - HALLWAY_TURN_S=${HALLWAY_TURN_S:-7.0}
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/rover_brain.py"
    restart: unless-stopped

  # Nav2 + slam_toolbox. Does not touch /cmd_vel. rover-brain forwards
  # /cmd_vel_nav only while the Go session is on.
  rover-nav:
    profiles: ["nav"]
    image: rover-nav:jazzy
    container_name: rover-nav
    network_mode: host
    depends_on:
      - microros-agent
    volumes:
      - .:/opt/fleet:ro
      - ./fastdds_udp.xml:/opt/fleet/fastdds_udp.xml:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - ROVER_IMU_GYRO_SIGN=${ROVER_IMU_GYRO_SIGN:-1.0}
      - ROVER_WHEEL_STRIPS=6
    command: ["bash", "/opt/fleet/rover_nav.sh"]
    restart: unless-stopped

  # Always-on rover data — hourly ROS bags under ~/rover-bags on dockerhost.
  rover-record:
    image: ros:jazzy-ros-base
    container_name: rover-record
    network_mode: host
    depends_on:
      - microros-agent
    volumes:
      - ${ROVER_BAG_DIR:-/root/rover-bags}:/bags
      - ./rover-record.sh:/opt/fleet/rover-record.sh:ro
      - ./rover-record-qos.yaml:/opt/fleet/rover-record-qos.yaml:ro
      - ./fastdds_udp.xml:/opt/fleet/fastdds_udp.xml:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - ROVER_BAG_DIR=/bags
      - ROVER_BAG_HOURS=${ROVER_BAG_HOURS:-1}
      - ROVER_BAG_RETENTION_DAYS=${ROVER_BAG_RETENTION_DAYS:-3}
    command: ["bash", "/opt/fleet/rover-record.sh"]
    restart: unless-stopped

  fleet-shell:
    image: ros:jazzy-ros-base
    container_name: fleet-shell
    network_mode: host
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
    working_dir: /opt/fleet
    command: ["sleep", "infinity"]
    restart: unless-stopped

  # Home Assistant MQTT (yoRadio broker). Wall panel: Stop all + battery/online.
  fleet-ha:
    build:
      context: .
      dockerfile: Dockerfile.ha
    image: robot-fleet-ha:local
    container_name: fleet-ha
    network_mode: host
    depends_on:
      - microros-agent
    env_file:
      - mqtt_secrets.env
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/fleet_ha_bridge.py"
    restart: unless-stopped

  # Legacy single-mode brains (dev only — do not run alongside fleet-brain).
  fleet-wander:
    profiles: ["wander"]
    image: ros:jazzy-ros-base
    container_name: fleet-wander
    network_mode: host
    depends_on:
      - microros-agent
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - BOT_NS=${BOT_NS:-bot1}
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/mini_wander.py"
    restart: unless-stopped

  fleet-beacon-chase:
    profiles: ["chase"]
    image: ros:jazzy-ros-base
    container_name: fleet-beacon-chase
    network_mode: host
    depends_on:
      - microros-agent
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - BOT_NS=${BOT_NS:-bot1}
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/beacon_chase.py"
    restart: unless-stopped

  # Rover camera ingest (DFRobot ESP32-S3 AI Cam V1.1). DISABLED until the camera exists:
  # only starts with `docker compose --profile camera up -d rover-camera`.
  rover-camera:
    image: ros:jazzy-ros-base
    container_name: rover-camera
    profiles: ["camera"]
    network_mode: host
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - CAMERA_URL=${ROVER_CAMERA_URL:-http://192.168.3.128:81/stream}
      - CAMERA_FRAME_ID=camera_link
      - CAMERA_INFO_YAML=/opt/fleet/config/rover_cam_info_xga.yaml
      - CAMERA_PUBLISH_RAW=0
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/rover_camera_bridge.py"
    restart: unless-stopped

  # Rover AI-cam light sensor -> /rover/light/lux (Float32) + /rover/light/night (Bool).
  # Same "camera" profile as rover-camera (off by default):
  #   docker compose --profile camera up -d rover-light
  rover-light:
    image: ros:jazzy-ros-base
    container_name: rover-light
    profiles: ["camera"]
    network_mode: host
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - ROVER_STATUS_URL=${ROVER_STATUS_URL:-http://192.168.3.128/status}
      - ROVER_LIGHT_PERIOD=1.0
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/rover_light_bridge.py"
    restart: unless-stopped

  # Wheel odometry + IMU restamp + static TFs + robot_localization EKF (odom->base_link).
  # Start: docker compose --profile slam up -d rover-odom   (frames/offsets: config/rover_frames.yaml)
  rover-odom:
    build:
      context: .
      dockerfile: Dockerfile.odom
    image: rover-odom:jazzy
    container_name: rover-odom
    profiles: ["slam"]
    network_mode: host
    volumes:
      - .:/opt/fleet:ro
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - ROVER_FRAMES_YAML=/opt/fleet/config/rover_frames.yaml
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      python3 /opt/fleet/rover_odom.py &
      source /opt/ros/jazzy/setup.bash &&
      exec ros2 run robot_localization ekf_node --ros-args -r __node:=rover_ekf
      --params-file /opt/fleet/config/ekf_rover.yaml"
    restart: unless-stopped

  # Monocular metric depth (Depth Anything V2 Metric-Indoor-Small) on the RTX 2060.
  # Person following (YOLO11s + ByteTrack). Not started by default. Dry-run: publishes /rover/follow/cmd,
  # /rover/follow/status, /rover/follow/debug/compressed only, never /cmd_vel.
  # Start dry-run: docker compose --profile follow up -d rover-follow     Real drive: ./follow.sh (allow_drive + cleanup)
  rover-follow:
    build:
      context: .
      dockerfile: Dockerfile.follow
    image: rover-follow:jazzy
    container_name: rover-follow
    profiles: ["follow"]
    network_mode: host
    runtime: nvidia
    volumes:
      - .:/opt/fleet:ro
      - ./captures:/captures
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - FOLLOW_DRY_RUN=${FOLLOW_DRY_RUN:-1}
      - FOLLOW_MAX_S=${FOLLOW_MAX_S:-1000000}
      - FOLLOW_MODEL=/weights/yolo11s.pt
      - FOLLOW_PITCH_DEG=-0.2   # off-rug live check 14:44 2026-10-22 (1.3 was on the rug)
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/person_follow.py"
    restart: "no"

  # Rover's ONE always-on behaviour: EXPLORE <-> FOLLOW person. Sole owner of /cmd_vel + /rover/session.
  # Driving is enabled ONLY by allow_drive (HA switch / MQTT lab/robots/allow_drive/set ON|OFF, retained);
  # with allow_drive OFF it runs fully and publishes what it would do on /rover/behaviour/{status,cmd}.
  rover-behaviour:
    image: rover-follow:jazzy
    container_name: rover-behaviour
    network_mode: host
    runtime: nvidia
    depends_on:
      - microros-agent
      - rover-brain
    volumes:
      - .:/opt/fleet:ro
      - ./captures:/captures
    environment:
      - DET_REMOTE=1                   # 0 = local YOLO11 only; 1 = use the YOLO-World detector when healthy, local YOLO11 otherwise
      - DET_URL=http://127.0.0.1:8765  # NUC detector; Windows PC: http://192.168.2.44:8765
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - FOLLOW_MODEL=/weights/yolo11s.pt
      - FOLLOW_PITCH_DEG=-0.2
      - FOLLOW_VMAX=0.22          # follow a bit quicker than explore cruise
      - FOLLOW_WMAX=0.10
      - FOLLOW_CONF=0.30
      - ORANGE_CONF=0.40          # YOLO COCO class 49 (the fruit), plus a 4-of-6 frame vote
      - EXPLORE_CRUISE=0.18
      - EXPLORE_WMAX=0.12
      - EXPLORE_PIVOT_W=0.14
      - FOLLOW_STOP_DIST=0.30
      - FOLLOW_SLOW_FROM=0.50
      - FOLLOW_TARGET_M=1.0
      - BEHAVIOUR_ENTER_S=0.5
      - BEHAVIOUR_EXIT_S=5.0
      - TAG_SIZE_M=0.10          # tag36h11, tags_100mm.pdf
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/rover_behaviour.py --search-after 1.5 --search-max-s 3.0 --kw 0.15 --kv 0.40 --dv 0.30"
    restart: unless-stopped

  # Names the object held up to Rover's AI cam (YOLO11 + Piper TTS -> MP3 -> AI cam /play?url=), relays AI cam whistles.
  rover-speech:
    build:
      context: .
      dockerfile: Dockerfile.speech
    image: rover-speech:jazzy
    container_name: rover-speech
    network_mode: host
    runtime: nvidia
    volumes:
      - .:/opt/fleet:ro
    environment:
      - DET_REMOTE=1                   # 0 = local YOLO11 only; 1 = use the YOLO-World detector when healthy, local YOLO11 otherwise
      - DET_URL=http://127.0.0.1:8765  # NUC detector; Windows PC: http://192.168.2.44:8765
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - AICAM_URL=http://192.168.3.128
      - SPEECH_HOST_IP=192.168.3.172
      - SPEECH_PORT=8099
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash && exec python3 /opt/fleet/rover_speech.py"
    restart: unless-stopped

  # YOLO-World detector on the NUC GPU (never drives anything). Not started by default.
  # Start: docker compose --profile detector up -d --build detector ; then DET_REMOTE=1 on rover-speech / rover-behaviour.
  # Windows RTX 3080 alternative: run detector/ there and set DET_URL=http://192.168.2.44:8765 on the clients.
  detector:
    profiles: ["detector"]
    build:
      context: .
      dockerfile: Dockerfile.detector
    image: rover-detector:jazzy
    container_name: detector
    network_mode: host
    runtime: nvidia
    working_dir: /dweights
    volumes:
      - .:/opt/fleet:ro
      - /data/swarm/detector-weights:/dweights
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DET_MODEL=yolov8l-worldv2.pt   # 6 GB 2060 shared with 4 other GPU nodes; x-worldv2 if it fits/keeps fps
      - DET_PORT=8765
      - DET_PULL=0                     # brain POSTs its own frames; 1 = also pull both MJPEG streams for /latest
    command: python3 /opt/fleet/detector/detector_server.py
    restart: unless-stopped

  # Start: docker compose --profile slam up -d rover-depth   (DEPTH_L8_SCALE=1 enables L8 scale correction)
  rover-depth:
    build:
      context: .
      dockerfile: Dockerfile.depth
    image: rover-depth:jazzy
    container_name: rover-depth
    profiles: ["slam"]
    network_mode: host
    runtime: nvidia
    volumes:
      - .:/opt/fleet:ro
      - ./captures:/captures
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DEPTH_L8_SCALE=${ROVER_DEPTH_L8_SCALE:-1}
      - DEPTH_SAMPLE_PATH=/captures/depth_sample.png
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec python3 /opt/fleet/rover_depth.py"
    restart: unless-stopped

  # Overhead LifeCam on the NUC (USB /dev/video0). Publishes /room/overhead and the live
  # picture /room/lifecam/image_raw/compressed.
  room-eye:
    image: rover-follow:jazzy
    container_name: room-eye
    network_mode: host
    runtime: nvidia
    devices:
      - /dev/video0:/dev/video0
    volumes:
      - .:/opt/fleet:ro
      - /tmp:/tmp
    environment:
      - DET_REMOTE=1                   # orange = YOLO-World "orange fruit" on the NUC detector, local YOLO11s if it is down
      - DET_URL=http://127.0.0.1:8765
      - ROS_DOMAIN_ID=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - ROOM_ORANGE_MODEL=/weights/yolo11s.pt
      - ORANGE_CONF=0.50         # real orange scores 0.70-0.74 as "orange ball" on the LifeCam; nothing else above 0.34
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
    command: >
      bash -lc "source /opt/ros/jazzy/setup.bash && python3 -u /opt/fleet/room_eye.py"
    restart: unless-stopped

  # LifeCam web view (ROS web_video_server). Live MJPEG:
  #   http://192.168.3.172:8090/stream?topic=/room/lifecam/image_raw&type=ros_compressed
  room-cam-web:
    build:
      context: .
      dockerfile: Dockerfile.webvideo
    image: web-video:jazzy
    container_name: room-cam-web
    network_mode: host
    environment:
      - ROS_DOMAIN_ID=0
      - FASTRTPS_DEFAULT_PROFILES_FILE=/opt/fleet/fastdds_udp.xml
    volumes:
      - .:/opt/fleet:ro
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      exec ros2 run web_video_server web_video_server --ros-args -p port:=8090 -p address:=0.0.0.0"
    restart: unless-stopped
