rover_ekf:
  ros__parameters:
    frequency: 30.0
    sensor_timeout: 0.5
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_link
    world_frame: odom
    # wheel odometry: vx, vyaw, plus vy=0 (diff drive can't slide sideways; bounds y covariance)
    odom0: /rover/odom/wheel
    odom0_config: [false, false, false,  false, false, false,
                   true,  true,  false,  false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_queue_size: 10
    # IMU (MPU, no magnetometer): yaw RATE only. The ESP's integrated yaw is not absolute and
    # double-counts the gyro; RTAB-Map loop closures correct heading drift via map->odom.
    imu0: /rover/imu/stamped
    imu0_config: [false, false, false,  false, false, false,
                  false, false, false,  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: false
    imu0_queue_size: 20
